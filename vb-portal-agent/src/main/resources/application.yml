  api-key: change-me
  heartbeat-interval-seconds: 30
  cypress-command: "npm run cypress:run -- --record --key 320fee3f-e846-4d37-9d1b-c9a03b52bbd2 --browser ${CYPRESS_BROWSER:-electron}"
