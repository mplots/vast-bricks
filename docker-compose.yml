services:
  postgres:
    image: postgres:17.3
    container_name: vast-bricks-postgres
    environment:
      POSTGRES_USER: bricks
      POSTGRES_PASSWORD: bricks
      POSTGRES_DB: bricks
      PGDATA: /postgres-data
      TZ: Europe/Riga
    volumes:
      - postgres-vast-bricks:/postgres-data
    ports:
      - target: 5432
        published: 2345
    shm_size: '256mb'
    command: ["postgres", "-c", "log_statement=all", "-c", "shared_preload_libraries=pg_stat_statements"]

  vb-portal-agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: vb-portal-agent/Dockerfile
    environment:
      MANS_PASTS_EMAIL: maris.plots@vastbricks.com
      MANS_PASTS_PASSWORD: fai1Theingien{eiJie8
      AGENT_API_KEY: change-me
      AGENT_SERVER_HOST: vastbricks.com
      AGENT_SERVER_PORT: 9095
      AGENT_WORK_DIR: /app/vb-cypress-manspasts
      AGENT_CYPRESS_COMMAND: "npm run cypress:run -- --browser ${CYPRESS_BROWSER:-electron}"
      AGENT_HEARTBEAT_INTERVAL_SECONDS: 30
    restart: unless-stopped

volumes:
  postgres-vast-bricks:
