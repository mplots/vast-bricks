syntax = "proto3";

package vastbricks.agent.v1;

option java_package = "com.vastbricks.agent.v1";
option java_multiple_files = true;
option java_outer_classname = "AgentProto";

service AgentService {
  rpc Connect(stream AgentEnvelope) returns (stream AgentEnvelope);
}

message AgentEnvelope {
  string agent_id = 1;
  oneof payload {
    Register register = 2;
    JobAssignment job_assignment = 3;
    JobAck job_ack = 4;
    JobProgress job_progress = 5;
    JobResult job_result = 6;
    Heartbeat heartbeat = 7;
    Error error = 8;
  }
}

message Register {
  string agent_name = 1;
  string version = 2;
  repeated string capabilities = 3;
}

message JobAssignment {
  string job_id = 1;
  JobType job_type = 2;
  string spec = 3;
  string base_url = 4;
  string pdf_path = 5;
  string command = 6;
  map<string, string> env = 7;
}

message JobAck {
  string job_id = 1;
  bool accepted = 2;
  string message = 3;
}

message JobProgress {
  string job_id = 1;
  int32 percent = 2;
  string message = 3;
}

message JobResult {
  string job_id = 1;
  bool success = 2;
  string message = 3;
  bytes pdf = 4;
  string content_type = 5;
  map<string, string> meta = 6;
}

message Heartbeat {
  int64 timestamp_epoch_ms = 1;
}

message Error {
  string message = 1;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_CYPRESS_PDF = 1;
}
