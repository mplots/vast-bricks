server:
  port : 6161

grpc:
  server:
    port: 9095
    max-inbound-message-bytes: 20971520

agent:
  api-key: change-me
  heartbeat-timeout-seconds: 90
  job-timeout-seconds: 300
  results:
    forward-url: ""

#logging:
#  level:
#    root: debug

spring:
  flyway:
    enabled: true
    url: 'jdbc:postgresql://localhost:2345/bricks'
    user: bricks
    password: bricks
    locations: classpath:/db/migration,classpath:/db/migration/data
    clean-disabled: false
    placeholders:
      lowest_offer_interval: '3 hours'
    schemas: public,rebrickable
  datasource:
    url: jdbc:postgresql://localhost:2345/bricks
    username: bricks
    password: bricks
    driver-class-name: org.postgresql.Driver


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
