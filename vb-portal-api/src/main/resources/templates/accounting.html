<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vast Bricks: Accounting</title>
    <th:block th:insert="~{fragments/product-common :: productStyles}"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            color: #1b2226;
            margin: 0;
            padding: 16px;
        }

        .page-shell {
            max-width: 1180px;
            margin: 0 auto;
        }

        .accounting-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 16px;
        }

        .accounting-header h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .home-button {
            position: absolute;
            left: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #fff;
            color: #333;
            text-decoration: none;
        }

        .toolbar,
        .table-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .toolbar {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .month-form {
            display: flex;
            align-items: end;
            gap: 10px;
        }

        .month-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #555;
            font-size: 13px;
            font-weight: 600;
        }

        .month-field input {
            min-height: 42px;
            padding: 7px 10px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #fff;
            color: #1b2226;
            font: inherit;
        }

        .month-form button {
            min-height: 42px;
            padding: 0 16px;
            border: 0;
            border-radius: 6px;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .order-count {
            color: #64748b;
            font-size: 14px;
        }

        .table-card {
            overflow: hidden;
        }

        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        tbody tr:hover {
            background: #f8fbff;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tfoot th,
        tfoot td {
            border-top: 2px solid #cbd5e1;
            border-bottom: 0;
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
        }

        tfoot th {
            text-align: right;
        }

        .number {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .total-mismatch {
            position: relative;
            background: #fee2e2;
            color: #b91c1c;
            cursor: help;
            font-weight: 700;
        }

        .total-mismatch:hover::after {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            z-index: 10;
            content: attr(data-calculated);
            padding: 7px 9px;
            border-radius: 5px;
            background: #1f2937;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
            transform: translateX(-50%);
        }

        .source {
            display: inline-flex;
            padding: 4px 9px;
            border-radius: 999px;
            background: #e3f2fd;
            color: #1565c0;
            font-size: 12px;
            font-weight: 700;
        }

        .source.owl {
            background: #fff3e0;
            color: #b45309;
        }

        .empty-state {
            padding: 48px 20px;
            color: #64748b;
            text-align: center;
        }

        .empty-state .material-icons {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 40px;
        }

        @media (max-width: 640px) {
            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .month-form {
                align-items: stretch;
            }

            .month-field {
                flex: 1;
            }
        }
    </style>
</head>
<body>
<main class="page-shell">
    <div class="accounting-header">
        <a href="/" class="home-button" aria-label="Go to home">
            <span class="material-icons">home</span>
        </a>
        <h2><span class="material-icons">receipt_long</span>Accounting</h2>
    </div>

    <section class="toolbar" aria-label="Accounting filters">
        <form class="month-form" method="get" action="/accounting">
            <label class="month-field" for="month">
                Order month
                <input id="month" name="month" type="month" th:value="${selectedMonth}">
            </label>
            <button type="submit">Show orders</button>
        </form>
        <span class="order-count"
              th:text="${#lists.size(orders) == 1 ? '1 order' : #lists.size(orders) + ' orders'}">0 orders</span>
    </section>

    <section class="table-card">
        <div class="table-scroll" th:if="${!#lists.isEmpty(orders)}">
            <table>
                <thead>
                <tr>
                    <th>Source</th>
                    <th>Date</th>
                    <th>Number</th>
                    <th>Buyer name</th>
                    <th>Location</th>
                    <th class="number">Lots</th>
                    <th class="number">Items</th>
                    <th class="number">Order total</th>
                    <th class="number">Shipping</th>
                    <th class="number" title="Tax collected from the customer and remitted to the marketplace">Tax</th>
                    <th class="number">Grand total</th>
                    <th class="number">VAT</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td>
                        <span class="source"
                              th:classappend="${order.source == 'Brick Owl'} ? ' owl'"
                              th:text="${order.source}">BrickLink</span>
                    </td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy')}">06.08.2026</td>
                    <td th:text="${order.orderNumber}">32266548</td>
                    <td th:text="${order.buyerName}">Buyer</td>
                    <td th:text="${order.location == null ? '—' : order.location}">Sweden</td>
                    <td class="number" th:text="${order.lotCount}">3</td>
                    <td class="number" th:text="${order.itemCount}">3</td>
                    <td class="number"
                        th:text="${order.orderTotal == null ? '—' : #numbers.formatDecimal(order.orderTotal, 1, 2)}">3.95</td>
                    <td class="number"
                        th:text="${order.shipping == null ? '—' : #numbers.formatDecimal(order.shipping, 1, 2)}">6.24</td>
                    <td class="number"
                        th:text="${order.marketplaceTaxPresent ? #numbers.formatDecimal(order.marketplaceTax, 1, 2) : '—'}">0.50</td>
                    <td class="number"
                        th:classappend="${order.grandTotalMismatch} ? ' total-mismatch'"
                        th:data-calculated="${order.grandTotalMismatch ? 'Calculated: ' + #numbers.formatDecimal(order.calculatedGrandTotal, 1, 2) : null}"
                        th:title="${order.grandTotalMismatch ? 'Calculated: ' + #numbers.formatDecimal(order.calculatedGrandTotal, 1, 2) : null}"
                        th:text="${order.grandTotal == null ? '—' : #numbers.formatDecimal(order.grandTotal, 1, 2)}">10.19</td>
                    <td class="number"
                        th:text="${order.vatPresent ? #numbers.formatDecimal(order.vat, 1, 2) : '—'}">1.77</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="5">Total</th>
                    <td class="number" th:text="${summary.lotCount}">3</td>
                    <td class="number" th:text="${summary.itemCount}">3</td>
                    <td class="number" th:text="${#numbers.formatDecimal(summary.orderTotal, 1, 2)}">3.95</td>
                    <td class="number" th:text="${#numbers.formatDecimal(summary.shipping, 1, 2)}">6.24</td>
                    <td class="number" th:text="${#numbers.formatDecimal(summary.marketplaceTax, 1, 2)}">0.50</td>
                    <td class="number" th:text="${#numbers.formatDecimal(summary.grandTotal, 1, 2)}">10.19</td>
                    <td class="number" th:text="${#numbers.formatDecimal(summary.vat, 1, 2)}">1.77</td>
                </tr>
                </tfoot>
            </table>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
            <span class="material-icons">inbox</span>
            No orders found for this month.
        </div>
    </section>
</main>
</body>
</html>
