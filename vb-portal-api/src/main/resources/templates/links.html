<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vast Bricks: Fresh LEGO® Parts</title>
    <meta name="description" content="We are Vast Bricks, a hobbyist LEGO reseller based in Riga, Latvia 🇱🇻. We offer only brand-new LEGO® parts, minifigures, and sets, and we pack every order with care and ship worldwide." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Vast Bricks" />
    <meta name="theme-color" content="#eef1f3" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://vastbricks.com" />

    <meta name="image" content="https://vastbricks.com/images/logo.png" />
    <meta property="og:title" content="Vast Bricks: Fresh LEGO® Parts" />
    <meta property="og:description" content="We are Vast Bricks, a hobbyist LEGO reseller based in Riga, Latvia 🇱🇻. We offer only brand-new LEGO® parts, minifigures, and sets, and we pack every order with care and ship worldwide." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vastbricks.com" />
    <meta property="og:image" content="https://vastbricks.com/images/logo.png" />
    <meta property="og:site_name" content="Vast Bricks" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vast Bricks: Fresh LEGO® Parts" />
    <meta name="twitter:description" content="We are Vast Bricks, a hobbyist LEGO reseller based in Riga, Latvia 🇱🇻. We offer only brand-new LEGO® parts, minifigures, and sets, and we pack every order with care and ship worldwide." />
    <meta name="twitter:image" content="https://vastbricks.com/images/logo.png" />

    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256x256.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/images/favicon-256x256.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebPage",
          "name": "Vast Bricks: Fresh LEGO® Parts",
          "url": "https://vastbricks.com",
          "description": "We are Vast Bricks, a hobbyist LEGO reseller based in Riga, Latvia 🇱🇻. We offer only brand-new LEGO® parts, minifigures, and sets, and we pack every order with care and ship worldwide.",
          "publisher": {
            "@type": "Organization",
            "name": "Vast Bricks",
            "logo": {
              "@type": "ImageObject",
              "url": "https://vastbricks.com/images/logo.png"
            }
          }
        }
    </script>
    <th:block th:replace="~{fragments/links-common :: linksStyles}"></th:block>
</head>
<body th:classappend="${orderThanks} ? 'qr-mode' : null">
<main class="page">
    <th:block th:replace="~{fragments/links-common :: linksHeader}"></th:block>

    <section class="qr-card" th:if="${orderThanks}">
        <h2 th:text="${'Hello ' + customerName + '.'}">Hello.</h2>
        <p class="qr-note">
            Thank you for your
            <span th:text="${orderSource}">BrickLink</span>
            order
            <a class="qr-link qr-link-order" th:href="${orderUrl}" th:text="${'#' + orderId}" target="_blank" rel="noopener"></a>.
        </p>
        <p class="qr-note">
            You can review your ordered items below or by clicking the order link directly in
            <span th:text="${orderSource}">BrickLink</span>.
            If everything looks good, we would love your
            <a class="qr-link qr-link-feedback" th:href="${feedbackUrl}" target="_blank" rel="noopener">feedback</a>.
        </p>
        <details class="qr-items" th:if="${orderItems}">
            <summary>
                Order items (<span th:text="${#lists.size(orderItems)}"></span>)
            </summary>
            <table class="qr-items-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Image</th>
                        <th>Qty</th>
                        <th>Item</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${orderItems}">
                        <td>
                            <label class="qr-check">
                                <input type="checkbox" />
                                <span class="qr-check-box"></span>
                            </label>
                        </td>
                        <td>
                            <img class="qr-item-img" th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="" />
                        </td>
                        <td th:text="${item.qty}"></td>
                        <td th:text="${item.name}"></td>
                    </tr>
                </tbody>
            </table>
        </details>
    </section>

    <th:block th:if="${orderThanks != true}" th:replace="~{fragments/links-common :: linksList}"></th:block>

    <th:block th:replace="~{fragments/links-common :: linksFooter}"></th:block>
</main>
</body>
</html>
