<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vast Bricks: Fresh LEGO® Parts, Stores, and Socials</title>

    <meta property="og:title" content="Vast Bricks: Fresh LEGO® Parts, Stores, and Socials" />
    <meta property="og:description" content="We sell only brand-new LEGO® parts, minifigures, and sets. Shop Vast Bricks on BrickLink® and BrickOwl, and follow our latest drops on Instagram." />

    <meta property="og:url" content="https://vastbricks.com" />
    <meta property="og:image" content="https://vastbricks.com/images/logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vast Bricks: Fresh LEGO® Parts, Stores, and Socials" />
    <meta name="twitter:description" content="We sell only brand-new LEGO® parts, minifigures, and sets. Shop Vast Bricks on BrickLink® and BrickOwl, and follow our latest drops on Instagram." />
    <meta name="twitter:image" content="https://vastbricks.com/images/logo.png" />

    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256x256.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/images/favicon-256x256.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebPage",
          "name": "Vast Bricks: Fresh LEGO® Parts, Stores, and Socials",
          "url": "https://vastbricks.com",
          "description": "We sell only brand-new LEGO® parts, minifigures, and sets. Shop Vast Bricks on BrickLink® and BrickOwl, and follow our latest drops on Instagram.",
          "publisher": {
            "@type": "Organization",
            "name": "Vast Bricks",
            "logo": {
              "@type": "ImageObject",
              "url": "https://vastbricks.com/images/logo.png"
            }
          }
        }
    </script>

    <style>
        :root {
            --bg: #f7f7f9;
            --bg-accent: #eaf3ff;
            --ink: #171717;
            --muted: #525252;
            --card: #ffffff;
            --border: rgba(23, 23, 23, 0.08);
            --shadow: 0 18px 40px rgba(23, 23, 23, 0.12);
            --accent-yellow: #f2c94c;
            --accent-red: #e53935;
            --accent-blue: #1e88e5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Space Grotesk", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 12% 12%, rgba(229, 57, 53, 0.15), transparent 55%),
                        radial-gradient(circle at 92% 0%, rgba(30, 136, 229, 0.18), transparent 45%),
                        radial-gradient(circle at 50% 90%, rgba(242, 201, 76, 0.22), transparent 45%),
                        linear-gradient(135deg, var(--bg), #ffffff 55%, var(--bg-accent));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 4rem 1.5rem 3rem;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 380px;
            height: 380px;
            background: conic-gradient(from 200deg, var(--accent-red), var(--accent-yellow), var(--accent-blue), var(--accent-red));
            opacity: 0.08;
            filter: blur(8px);
            border-radius: 50%;
            z-index: 0;
        }

        body::before {
            top: -140px;
            left: -120px;
        }

        body::after {
            bottom: -180px;
            right: -120px;
        }

        .page {
            width: 100%;
            max-width: 560px;
            background: var(--card);
            border-radius: 28px;
            padding: 2.5rem 2.25rem 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand img {
            width: 120px;
            height: auto;
            margin-bottom: 1rem;
        }

        .brand h1 {
            font-size: 2rem;
            margin: 0 0 0.4rem;
            letter-spacing: -0.02em;
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .link-list {
            display: grid;
            gap: 1rem;
            margin: 2rem 0 1.5rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border);
            background: #ffffff;
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(31, 31, 31, 0.12);
        }

        .link-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .link-text {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .link-text strong {
            font-size: 1.05rem;
        }

        .link-text span {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .icon-bricklink {
            background: rgba(229, 57, 53, 0.12);
        }

        .icon-brickowl {
            background: rgba(242, 201, 76, 0.18);
        }

        .icon-instagram {
            background: rgba(30, 136, 229, 0.14);
        }

        .link-icon img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 3rem 1rem 2rem;
            }

            .page {
                padding: 2rem 1.5rem 1.75rem;
            }

            .brand h1 {
                font-size: 1.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .link-card {
                transition: none;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="brand">
        <img src="/images/logo.png" alt="Vast Bricks logo" />
        <h1>Vast Bricks</h1>
        <p>We sell only brand-new LEGO® parts, minifigures, and sets. Shop Vast Bricks on BrickLink® and BrickOwl, and follow our latest drops on Instagram.</p>
    </header>

    <section class="link-list" aria-label="Vast Bricks links">
        <a class="link-card" href="https://store.bricklink.com/vastbricks" target="_blank" rel="noopener">
            <span class="link-icon icon-bricklink" aria-hidden="true">
                <img src="/images/bricklink.png" alt="" width="28" height="28" />
            </span>
            <span class="link-text">
                <strong>BrickLink Store</strong>
                <span>store.bricklink.com/vastbricks</span>
            </span>
        </a>

        <a class="link-card" href="https://vastbricks.brickowl.com" target="_blank" rel="noopener">
            <span class="link-icon icon-brickowl" aria-hidden="true">
                <img src="/images/brickowl.png" alt="" width="30" height="30" />
            </span>
            <span class="link-text">
                <strong>BrickOwl Shop</strong>
                <span>vastbricks.brickowl.com</span>
            </span>
        </a>

        <a class="link-card" href="https://www.instagram.com/vastbricks" target="_blank" rel="noopener">
            <span class="link-icon icon-instagram" aria-hidden="true">
                <img src="/images/instagram.png" alt="" width="30" height="30" />
            </span>
            <span class="link-text">
                <strong>Instagram</strong>
                <span>@vastbricks</span>
            </span>
        </a>
    </section>

    <footer>
        © Vast Bricks <span id="year">2025</span>
    </footer>
</main>
<script>
    document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
