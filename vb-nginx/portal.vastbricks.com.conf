server {
  listen 80;
  listen [::]:80;

  server_name portal.vastbricks.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  http2 on;

  server_name portal.vastbricks.com;

  ssl_certificate     /etc/letsencrypt/live/portal.vastbricks.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portal.vastbricks.com/privkey.pem;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html/vb-portal;
  index index.html;

  location = /api/account/login {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/private/ {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    return 404;
  }

  location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
